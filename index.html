<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GESDOC - Iniciar sesion</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="container narrow">
  <div class="card login-card">
    <div class="brand">GESDOC</div>
    <div class="subtitle">Control documental de proyectos</div>
    <form id="loginForm">
      <label for="email">Usuario</label>
      <input type="text" id="email" required autocomplete="username" placeholder="jmanteiga">
      <label for="password">Contrasena</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" class="btn primary" style="width:100%;margin-top:16px;">Entrar</button>
      <div class="error-msg" id="errMsg" hidden></div>
      <div class="hint" style="text-align:center;margin-top:14px;">
        Las cuentas las crea un administrador desde Supabase (Authentication &gt; Users).
      </div>
    </form>
  </div>
</div>

<script type="module">
import './js/pwa.js';
import { supabase } from './js/db.js';
import { USERNAME_DOMAIN_SUFFIX } from './config.js';

// Si ya hay sesion activa, ir directo al panel.
const { data: { session } } = await supabase.auth.getSession();
if (session) window.location.href = 'dashboard.html';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  let email = document.getElementById('email').value.trim();
  if (email && !email.includes('@')) email += USERNAME_DOMAIN_SUFFIX;
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('errMsg');
  errEl.hidden = true;
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = error.message === 'Invalid login credentials'
      ? 'Email o contrasena incorrectos.'
      : error.message;
    errEl.hidden = false;
    return;
  }
  window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
